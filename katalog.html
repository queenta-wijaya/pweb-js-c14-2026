<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shopee | Katalog Produk</title>
    <link rel="stylesheet" href="katalog.css">
    <script src="katalog.js" defer></script>
    <script src="interaktif.js" defer></script>
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <div class="navbar-left">
            <h1 class="brand">Mini Shopee</h1>
        </div>

        <!-- Search & filter: markup by Anggota 2, logic (debounce, filter, sort) by Anggota 3 -->
        <div class="navbar-center">
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Cari produk atau kategori..."
            >

            <select id="category-filter" class="select-control">
                <option value="all">Semua kategori</option>
            </select>

            <select id="sort-control" class="select-control">
                <option value="default">Urutkan</option>
                <option value="price-asc">Harga: Termurah</option>
                <option value="price-desc">Harga: Termahal</option>
                <option value="rating-desc">Rating Tertinggi</option>
            </select>
        </div>

        <div class="navbar-right">
            <!-- Cart button: markup by Anggota 2, CRUD logic by Anggota 3 -->
            <button id="cart-btn" class="cart-btn">
                🛒 Keranjang
                <span id="cart-badge" class="cart-badge">0</span>
            </button>

            <span id="welcome-text" class="welcome-text">Halo, Pengguna</span>
            <button id="logout-btn" class="logout-btn">Keluar</button>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <p id="result-info" class="result-info"></p>

        <div id="global-error" class="global-error hidden">
            Gagal memuat data produk. Silakan periksa koneksi internet Anda dan muat ulang halaman.
        </div>

        <!-- Event delegation target: single listener attached here in katalog.js -->
        <section id="product-grid" class="product-grid"></section>

        <div id="empty-state" class="empty-state hidden">
            Tidak ada produk yang cocok dengan pencarian/filter kamu.
        </div>

        <div class="load-more-wrapper">
            <button id="load-more-btn" class="load-more-btn">Muat lebih banyak</button>
        </div>
    </main>

    <!-- ================= MODAL DETAIL PRODUK ================= -->
    <div id="product-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <button id="modal-close" class="modal-close">&times;</button>

            <div class="modal-body">
                <img id="modal-img" class="modal-img" src="" alt="">

                <div class="modal-info">
                    <span id="modal-category" class="modal-category"></span>
                    <h2 id="modal-title"></h2>
                    <p id="modal-brand" class="modal-brand"></p>

                    <div class="modal-price-row">
                        <span id="modal-price" class="modal-price"></span>
                        <span id="modal-rating" class="modal-rating"></span>
                    </div>

                    <p id="modal-stock" class="modal-stock"></p>
                    <p id="modal-desc" class="modal-desc"></p>

                    <button id="modal-add-cart" class="add-cart-btn">Tambah ke Keranjang</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
